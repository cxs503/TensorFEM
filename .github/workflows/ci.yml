name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Ratchet, not a relaxation.  The job used to lint the whole tree, so it was
    # red on every ref -- including main -- because of a pre-existing backlog
    # (semicolon/colon-packed statements, unused imports, star imports), which
    # told reviewers nothing about the change under review.  scripts/lint_ratchet.py
    # now measures only the Python files the change touches and compares each of
    # them with its own version at the merge base: debt may be inherited, never
    # added.  The whole-tree backlog is still printed for the record and can only
    # shrink; once it is empty, delete continue-on-error to promote this job to a
    # blocking gate (it is already precise enough for that).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # the ratchet needs a merge base against the target branch
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint ratchet on changed files (ruff check + ruff format)
        # Fails only when this change increases a file's findings or leaves a
        # previously formatted file unformatted.  Exit code 2 means the gate
        # could not measure (no merge base, no ruff) and also fails the step.
        run: python scripts/lint_ratchet.py --base "origin/${{ github.base_ref || 'main' }}"
      - name: Whole-tree lint debt (report only)
        if: always()
        run: |
          ruff check src tests scripts examples --statistics || true
          ruff format --check src tests scripts examples || true
