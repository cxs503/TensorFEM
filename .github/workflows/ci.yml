name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (debt ratchet)
    runs-on: ubuntu-latest
    # Blocking, but against a *frozen debt ledger* rather than against a clean
    # tree.  The tree carries a large pre-existing ruff backlog (4 271 check
    # violations in 347 files, 624 files `ruff format` would rewrite), so a
    # plain `ruff check` could only be made green by a repository-wide rewrite
    # that would bury every other signal - and leaving the job advisory, as it
    # was before, let fresh debt in unnoticed.
    #
    # `scripts/lint_gate.py --check` compares today's ruff output with
    # docs/lint-baseline.json and fails on *new* debt only: a grown
    # file -> rule count, a rule in a file that did not have it, or a file that
    # needs reformatting and is not in the frozen set.  Debt that is paid down
    # is reported as progress and re-frozen with `--update-baseline` in a
    # reviewable commit.  Policy and burn-down plan: docs/lint-debt-baseline.md.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Pinned: the ledger is ruff-version specific, and a new ruff release
          # with new rules must not turn every open PR red.  Bumping this pin
          # is a deliberate commit that also re-freezes the baseline.
          pip install "ruff==0.15.0"
      - name: Lint debt ratchet (ruff check)
        run: python scripts/lint_gate.py --check --report artifacts/lint-report.json
      - name: Raw ruff output (informational, line-level detail for fixing)
        if: always()
        continue-on-error: true
        run: |
          ruff check src tests scripts examples --statistics || true
          ruff format --check src tests scripts examples || true
      - name: Upload lint debt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: artifacts/lint-report.json