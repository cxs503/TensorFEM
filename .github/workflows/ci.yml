name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # The check name above is kept verbatim on purpose: branch protection and
    # the PR gate key on the check context, so renaming it would silently drop
    # the signal instead of turning it green.
    #
    # `main` still carries a large *pre-existing* ruff backlog (4268 findings
    # in 344 of 546 python files, 619 files `ruff format` would rewrite), so a
    # whole-tree lint is red for every commit and carries no information.  The
    # gate is therefore a ratchet (scripts/lint_ratchet.py): a change set may
    # not add findings and may not add newly unformatted code, while the
    # backlog itself is printed as an advisory number that can be burned down
    # deliberately.  See docs/pr131-lint-fix-m4155.md.
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet diffs against the base commit, so full history (or at
          # least the base) has to be present.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint ratchet (no new findings, new files format clean)
        env:
          # pull_request -> the merge-base commit; push -> the previous tip.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # New ref / shallow history / workflow_dispatch: fall back to the
            # immediate parent, and let the script skip if that is missing too.
            base="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          echo "lint ratchet base: ${base:-<none>}"
          python scripts/lint_ratchet.py --base "$base" --summary artifacts/lint-ratchet.json
      - name: Upload ratchet summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-ratchet
          path: artifacts/lint-ratchet.json
      - name: Whole-tree backlog snapshot (advisory, never fails)
        # Visibility only: this number is the burn-down target, not a gate.
        continue-on-error: true
        run: |
          ruff check src tests scripts examples --statistics || true
          ruff format --check src tests scripts examples || true