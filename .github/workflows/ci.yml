name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory, and scoped on purpose.  The tree carries a large pre-existing
    # ruff backlog (~4.2k findings: E701/E702 semicolon- and colon-packed
    # statements, unused imports, ~560 files `ruff format` would rewrite), so a
    # repo-wide `ruff check src tests scripts examples` failed on every run and
    # its red carried no information about the change under review.
    #
    # The job therefore runs the ratchet in scripts/lint_changed.py: the Python
    # files a pull request touches are linted and format-checked, while the
    # legacy backlog stays grandfathered (docs/lint-ratchet.md).  New debt is
    # still caught, so the signal is live without a mass rewrite.  When
    # `python scripts/lint_changed.py --all` is clean, swap the last step for
    # `--all` and drop continue-on-error to make lint a blocking gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The ratchet diffs against the merge base of the PR target branch or
          # the previously pushed commit; a depth-1 clone cannot resolve either.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Resolve the lint comparison base
        id: lint_base
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pull requests compare against the branch they target.
            git fetch --no-tags --quiet origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] \
            && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            # Pushes compare against the previous head of the same ref.
            base="${{ github.event.before }}"
          else
            base="HEAD^"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "lint comparison base: $base"
      - name: Lint and format-check the changed files (ruff ratchet)
        run: >-
          python scripts/lint_changed.py
          --base "${{ steps.lint_base.outputs.base }}"
          --report lint-report.json
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.json
