name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Change-scoped gate.  The tree still carries a large pre-existing ruff
    # backlog (thousands of E701/E702 statements over hundreds of legacy
    # files), so a whole-tree run reports red on every commit -- including
    # commits that add clean code -- and the signal is worthless.  We lint the
    # *change* instead: the Python files this PR/push touches under
    # src/, tests/, scripts/, examples/ and benchmarks/ (see
    # scripts/lint_scope.sh).  Legacy debt is then paid down file by file and
    # can never silence the gate for new work.
    #
    # Advisory only for the backstop case below: when no base revision can be
    # resolved (e.g. a manual workflow_dispatch on a shallow clone) the scope
    # widens to the whole tree and is expected to be red against the backlog.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope needs the base commit of the change, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Select lint scope (Python files changed by this change)
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          bash scripts/lint_scope.sh | tee lint-scope.txt
          echo "count=$(wc -l < lint-scope.txt)" >> "$GITHUB_OUTPUT"
      - name: Lint (ruff)
        if: steps.scope.outputs.count != '0'
        run: xargs -r -a lint-scope.txt -d '\n' ruff check
      - name: Format check (ruff format)
        if: steps.scope.outputs.count != '0'
        run: xargs -r -a lint-scope.txt -d '\n' ruff format --check
      - name: Nothing to lint
        if: steps.scope.outputs.count == '0'
        run: echo "No Python files changed in the linted trees; ruff steps skipped."