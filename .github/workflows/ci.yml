name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"

jobs:
  test:
    name: test (py311)
    runs-on: ci-loong64
    steps:
      - uses: actions/checkout@v4
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py311
          path: coverage.xml

  api-compat:
    name: public API compatibility
    runs-on: ci-loong64
    # The manifest promises ``stable = "semver compatibility"`` but the snapshot
    # checks only compare manifest against code *in the same tree*, so a deleted
    # or demoted stable name is invisible to them (measured: 0/2 such faults
    # caught by scripts/audit_public_api.py, 2/2 by this gate -- see
    # artifacts/m18005_public_api_compat_baseline.json).  This job compares the
    # change against the reviewed manifest of the base commit instead.  It is
    # stdlib-only, so no dependency install is needed.
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is read out of git history, not out of the working tree.
          fetch-depth: 0
      - name: Resolve the baseline manifest
        id: base
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ref="$GITHUB_BASE_SHA"
          else
            ref="$GITHUB_BEFORE_SHA"
          fi
          if [ -z "$ref" ] || ! git cat-file -e "$ref:api/public-api-v1.json" 2>/dev/null; then
            # New branch, force push or shallow tip: there is no reviewed
            # baseline to compare against, so announce the skip instead of
            # failing on an artefact of the event payload.
            echo "No baseline manifest at ${ref:-<empty>}; compatibility gate skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Check release-to-release compatibility
        if: steps.base.outputs.skip != 'true'
        run: |
          python scripts/public_api_compat.py --mode pr \
            --base "git:${{ steps.base.outputs.ref }}:api/public-api-v1.json" \
            --head api/public-api-v1.json

  lint:
    name: lint (advisory)
    runs-on: ci-loong64
    # Change-scoped gate.  The tree still carries a large pre-existing ruff
    # backlog (thousands of E701/E702 statements over hundreds of legacy
    # files), so a whole-tree run reports red on every commit -- including
    # commits that add clean code -- and the signal is worthless.  We lint the
    # *change* instead: the Python files this PR/push touches under
    # src/, tests/, scripts/, examples/ and benchmarks/ (see
    # scripts/lint_scope.sh).  Legacy debt is then paid down file by file and
    # can never silence the gate for new work.
    #
    # Advisory only for the backstop case below: when no base revision can be
    # resolved (e.g. a manual workflow_dispatch on a shallow clone) the scope
    # widens to the whole tree and is expected to be red against the backlog.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope needs the base commit of the change, not just the tip.
          fetch-depth: 0
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Select lint scope (Python files changed by this change)
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          bash scripts/lint_scope.sh | tee lint-scope.txt
          echo "count=$(wc -l < lint-scope.txt)" >> "$GITHUB_OUTPUT"
      - name: Lint (ruff)
        if: steps.scope.outputs.count != '0'
        run: xargs -r -a lint-scope.txt -d '\n' ruff check
      - name: Format check (ruff format)
        if: steps.scope.outputs.count != '0'
        run: xargs -r -a lint-scope.txt -d '\n' ruff format --check
      - name: Nothing to lint
        if: steps.scope.outputs.count == '0'
        run: echo "No Python files changed in the linted trees; ruff steps skipped."