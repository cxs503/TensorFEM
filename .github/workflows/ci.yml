name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose: the tree carries a large pre-existing ruff backlog
    # (unused imports, import ordering, semicolon-packed statements).  Charging
    # that debt to every PR makes the check permanently red, which hides the
    # one signal it can still give: whether THIS push adds lint debt.  So the
    # gating steps are ratcheted to the .py files this push/PR touches -- a PR
    # is green only if its own files are ruff-clean, and any legacy file it
    # touches inherits the full rule set (the ratchet never forgives a file
    # someone is already editing).  The whole-tree run stays as an
    # informational step so burn-down progress stays measurable; drop the
    # continue-on-error once that report reaches zero errors.
    # Evidence for the split: docs/pr112-lint-cure.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # the ratchet diffs against the base commit, so the history must be
          # complete -- a shallow clone cannot resolve merge-base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Resolve ruff scope (files touched by this push/PR)
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="${{ github.event.before }}"; fi
          python scripts/ci_lint_scope.py --base "$base" --out "$RUNNER_TEMP/ruff-scope.txt"
      - name: Lint changed files (ruff, gating)
        run: |
          scope="$RUNNER_TEMP/ruff-scope.txt"
          if [ ! -s "$scope" ]; then
            echo "No changed python file under src/tests/scripts/examples: nothing to lint."
            exit 0
          fi
          echo "Linting $(wc -l < "$scope") changed file(s):"
          cat "$scope"
          xargs -d '\n' -a "$scope" ruff check
          xargs -d '\n' -a "$scope" ruff format --check
      - name: Whole-tree backlog (informational)
        if: always()
        run: |
          echo "Pre-existing repo-wide backlog (not attributed to this push):"
          ruff check src tests scripts examples 2>&1 | tail -n 2 || true
          ruff format --check src tests scripts examples 2>&1 | tail -n 2 || true
