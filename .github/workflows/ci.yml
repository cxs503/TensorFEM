name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint
    runs-on: ubuntu-latest
    # Two blocking gates plus the still-unpaid backlog as advisory signal.
    # The tree is not ruff-clean (see scripts/lint_baseline.json), so a
    # whole-tree `ruff check` cannot be a gate without blocking every pull
    # request; the ratchet below rejects *new* debt instead, and the advisory
    # steps keep the drain progress visible.  Reproduce locally with
    # `pytest tests/test_lint_ratchet.py` and `python scripts/lint_ratchet.py`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Gate 1: bug-class rules.  They are clean tree-wide today (verified:
      # `ruff check --select E9,F63,F7,F82,F811` passes on all four roots), so
      # they are required outright: syntax errors, undefined names,
      # comprehension rebindings, is-literal comparisons.
      - name: Lint (ruff, bug-class gate)
        run: ruff check --select E9,F63,F7,F82,F811 src tests scripts examples
      # Gate 2: ratchet.  Pre-existing debt (E701/E702 semicolon packing, F401,
      # E741, ...) is frozen in scripts/lint_baseline.json; any new violation,
      # new rule, new file or new format debt fails the job.  Pay debt down,
      # then re-freeze with `python scripts/lint_ratchet.py --update`.
      - name: Lint (ruff, ratchet against the frozen backlog)
        run: python scripts/lint_ratchet.py
      - name: Lint (ruff, full tree, advisory)
        continue-on-error: true
        run: ruff check src tests scripts examples
      - name: Format check (ruff format, full tree, advisory)
        continue-on-error: true
        run: ruff format --check src tests scripts examples
