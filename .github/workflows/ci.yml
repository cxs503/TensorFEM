name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the signal on the default branch stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Install the optional TensorLBM fixture dependency
        # tensorfem.fluid_rigid_feedback couples to the sibling TensorLBM
        # checkout.  Installing it keeps that fixture under test here instead
        # of it silently not running.  It stays an optional extra so
        # TensorFEM itself remains installable without the sibling repo.
        run: pip install "git+https://github.com/cxs503/TensorLBM.git"
      - name: Run tests
        # --timeout activates pytest-timeout so a hung solver fails the job
        # instead of burning the runner limit.
        run: pytest -q --timeout=1800 --cov=tensorfem --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  lint:
    name: lint (advisory)
    runs-on: ubuntu-latest
    # The tree still carries a large pre-existing ruff *style* backlog (4000+
    # findings over 600+ files), so a tree-wide `ruff check` on the default rule
    # set can never be green and reads as a permanent failure on every branch --
    # including branches that touch no Python at all.  The job is split into
    # three steps with different contracts instead:
    #   1. correctness rules, tree-wide, blocking (pyproject [tool.ruff.lint]);
    #   2. `ruff format` ratcheted on the files this change touches
    #      (scripts/lint_gate.py), so new code must be formatted while legacy
    #      files never drag an unrelated reformat diff into a small change;
    #   3. the remaining style backlog, counted only -- burn-down signal.
    # Steps 1-2 are hard gates *within* the job.  The job keeps
    # continue-on-error until the backlog counter reaches zero (that is also what
    # lets a sibling PR that predates this split stay mergeable); drop it in the
    # same change that empties the counter.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # The format ratchet diffs against the merge base with main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff correctness rules)
        run: ruff check src tests scripts examples
      - name: Format ratchet (ruff format, changed files only)
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/lint_gate.py --base origin/main
      - name: Legacy style backlog (advisory)
        # Burn-down counters; never fails the job.  Drive them to zero, then
        # widen [tool.ruff.lint] select and drop the continue-on-error above.
        run: |
          ruff check --select E4,E7,E9,F --statistics src tests scripts examples || true
          python scripts/lint_gate.py --all --count
