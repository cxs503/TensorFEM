name: Solver integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    # Independent of the self-hosted full-suite runner; no sibling main checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject tracked credentials
        run: python scripts/check_tracked_secrets.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Check public API and measured gate evidence
        run: |
          python scripts/audit_public_api.py --json
          python scripts/m17947_gate_baseline_compare.py --check
          python scripts/m14835_public_api_evidence.py --check
      - name: Run solver and admission regressions
        run: |
          pytest -q --timeout=180 --junitxml=solver-integrity.xml \
            tests/test_parallel_fem.py tests/test_registry_evidence_audit.py \
            tests/test_benchmark_registry.py tests/test_public_api_contract.py \
            tests/test_public_api_manifest_gate.py tests/test_hex20_sparse_contract.py \
            tests/test_public_api_compat_semver.py tests/test_m14835_cohesive3d_public_api.py \
            tests/test_structural_verification.py tests/test_p19_ladder_artifacts.py \
            tests/test_fsi_ice_3d_coupling.py tests/test_tracked_secrets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solver-integrity
          path: solver-integrity.xml
