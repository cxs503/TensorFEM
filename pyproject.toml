[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorfem"
version = "0.45.0"
description = "Differentiable structural finite element analysis with PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "TensorFEM Contributors"}]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
# scipy is a declared dev dependency because the cylindrical shell buckling
# qualification (tensorfem.cylindrical_shell_buckling) assembles its
# generalised eigenproblem with scipy.sparse and its tests exercise that
# path.  The library core stays torch-only; the feature reports a clear
# RuntimeError when scipy is absent.
# ruff is pinned to the minor release the lint gate is qualified against
# (0.15.x, see docs/lint-gate-determinism.md).  An unbounded ``ruff>=0.6``
# floats the gate definition itself: ruff promotes new stable rules into its
# default ``select`` at minor releases, and CI picked up ruff 0.17.4 on
# 2026-11-06 and reddened the change-scoped lint job on code it had already
# passed.  0.15.x is also the newest release with a loong64 wheel, so the
# GitHub runner and the loong64 development nodes execute the same binary.
# Bump deliberately, re-qualifying the tree in the same change.
dev = ["pytest>=8", "ruff>=0.15,<0.16", "pytest-timeout>=2.3", "pytest-cov>=5.0", "numpy>=1.26", "matplotlib>=3.8", "scipy>=1.11", "mpmath>=1.3"]
reports = ["numpy>=1.26", "matplotlib>=3.8", "python-docx>=1.1", "reportlab>=4", "markdown>=3.5"]
# The fluid/rigid feedback fixture couples to the sibling TensorLBM checkout.
# It stays optional so TensorFEM remains installable on its own.
fvm-fixture = ["tensorlbm @ git+https://github.com/cxs503/TensorLBM.git"]
# Optional: lets the signed evidence report pin the BLAS thread pools.  The
# report does not depend on it; the canonical digest provides the guarantee.
reproducible = ["threadpoolctl>=3.1"]

[project.scripts]
tensorfem = "tensorfem.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tensorfem = ["public_api_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# --strict-markers: an unregistered/mistyped marker is an error instead of a
# silently inert decorator, so the lanes below cannot be broken by a typo.
addopts = "--strict-markers"
# Test lanes (see tests/conftest.py and docs/test-lanes.md).  One test body
# set, two selections: the full lane (plain `pytest`, what CI runs) and the
# fast lane (`pytest --fast` == `pytest -m "not slow"`).  The `slow` marker
# only ever changes *which* tests run -- never what they assert -- so the fast
# lane stays a real gate for the unmarked population.  Marking policy and the
# registry live in docs/test-lanes.md and tests/slow_lane_manifest.txt.
markers = [
    "slow: heavyweight qualification case (mesh-convergence sweep, long nonlinear path, industrial sparse factorisation, contact qualification study); deselected by the fast lane (`pytest --fast`), run by the full lane.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The gate's rule set is pinned here instead of inherited from ruff's
# implicit defaults.  ruff promotes newly stable rules into the default
# `select` at minor releases, so an unqualified `ruff check` silently
# redefines the gate: ruff 0.17.4 widened the defaults with the I/UP/RUF/C4/PL
# families and turned the change-scoped CI lint red on main commit 696666b8
# without a single line of code having changed (CI run 42128721836).  Pinning
# keeps the blocking gate reproducible across ruff upgrades; new families are
# adopted deliberately, in a change that also pays down the findings they
# raise (see docs/lint-gate-determinism.md).  The selected groups are the
# pre-0.17 default set, which the tree was qualified against; the repo-wide
# findings under it are the tracked legacy backlog the change-scoped gate
# exists to pay down file by file.
select = ["E4", "E7", "E9", "F"]
